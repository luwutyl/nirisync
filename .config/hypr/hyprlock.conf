label { # User
    monitor =
    text =   $USER
    color = $text_color
    outline_thickness = 2
    dots_size = 0
    dots_spacing = 0
    dots_center = true
    font_size = 25
    font_family = $font_family
    position = 0, 50
    halign = center
    valign = bottom
}

label { # Caps
    monitor =
    text = cmd[update:200] echo "$(~/.config/hypr/scripts/caps.sh)"
    color = $text_color
    font_size = 19
    font_family = $font_family

    position = 0, -280
    halign = center
    valign = center
}
